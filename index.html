<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日份开心 💕</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 40px;
      max-width: 600px;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .emoji {
      font-size: 80px;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
      display: inline-block;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      color: white;
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .message {
      color: rgba(255,255,255,0.95);
      font-size: 20px;
      line-height: 1.8;
      margin-bottom: 40px;
      text-shadow: 0 1px 5px rgba(0,0,0,0.1);
    }

    .btn {
      background: white;
      color: #764ba2;
      border: none;
      padding: 16px 40px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      margin: 10px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: float 10s infinite linear;
      opacity: 0.6;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-100px) rotate(720deg);
        opacity: 0;
      }
    }

    .hidden {
      display: none;
    }

    .surprise {
      background: rgba(255,255,255,0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: popIn 0.5s ease-out;
    }

    @keyframes popIn {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .surprise h2 {
      color: #764ba2;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .surprise p {
      color: #555;
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 15px;
    }

    .gift-box {
      font-size: 60px;
      margin: 20px 0;
      animation: shake 1s infinite;
    }

    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }

    .footer {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <div class="container" id="main">
    <div class="emoji">💝</div>
    <h1>今日份开心</h1>
    <p class="message">
      亲爱的，<br>
      你做的每一个 3D 模型都很棒，<br>
      但最棒的是你这个人 
    </p>
    <button class="btn" onclick="showSurprise()">点我有惊喜 🎁</button>
  </div>

  <div class="container hidden" id="surprise">
    <div class="surprise">
      <div class="gift-box"></div>
      <h2>惊喜来啦！</h2>
      <p>
        今天也要开心哦！<br>
        你认真工作的样子最美 ✨
      </p>
      <p>
        记得休息，记得喝水，<br>
        记得... 你超棒的！💪
      </p>
      <button class="btn" onclick="resetPage()">再看一次 💕</button>
    </div>
  </div>

  <div class="footer">
    Made with  for you
  </div>

  <script>
    // 创建漂浮的爱心
    function createHearts() {
      const heartsContainer = document.getElementById('hearts');
      const emojis = ['💕', '💖', '💗', '💓', '💝', '✨', '⭐'];

      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDelay = Math.random() * 10 + 's';
        heart.style.animationDuration = (Math.random() * 5 + 8) + 's';
        heartsContainer.appendChild(heart);
      }
    }

    function showSurprise() {
      document.getElementById('main').classList.add('hidden');
      document.getElementById('surprise').classList.remove('hidden');

      // 创建更多爱心
      for (let i = 0; i < 10; i++) {
        setTimeout(() => {
          const heartsContainer = document.getElementById('hearts');
          const heart = document.createElement('div');
          heart.className = 'heart';
          heart.textContent = '🎉';
          heart.style.left = Math.random() * 100 + '%';
          heart.style.animationDuration = '5s';
          heartsContainer.appendChild(heart);
        }, i * 200);
      }
    }

    function resetPage() {
      document.getElementById('surprise').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
    }

    // 初始化
    createHearts();
  </script>
</body>
</html>
